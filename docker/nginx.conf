# Cardápio digital — nginx (container de produção, porta 8080, sem root).
map $uri $cache_control {
    default                                                        "no-cache";
    "~^/_astro/"                                                   "public, max-age=31536000, immutable";
    "~^/(favicon\.svg|apple-touch-icon\.png|icon-[a-z0-9-]+\.png)$" "public, max-age=604800";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Usado pelo HEALTHCHECK do container
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos ocultos nunca são servidos
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
