name: stackburguer

services:
  # Produção: build otimizado servido por nginx → http://localhost:8080
  web:
    build: .
    image: stackburguer:local
    ports:
      - '8080:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Desenvolvimento com hot reload → http://localhost:4321
  #   docker compose --profile dev up dev
  dev:
    profiles: ['dev']
    image: node:22-bookworm-slim
    working_dir: /app
    command: ['sh', 'docker/dev-entrypoint.sh']
    environment:
      ASTRO_POLLING: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - npm_cache:/root/.npm

volumes:
  dev_node_modules:
  npm_cache:
