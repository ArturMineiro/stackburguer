name: CI/CD

# Push na main → testa, gera o site (com PDFs e prévia do link) e publica na Hostinger.
# Pull requests → só testam.
#
# Configuração (Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR  (pasta do site no FTP, terminando com "/"; ex.: ./ ou public_html/steakburger/)
#              FTP_PROTOCOL    (opcional: ftp [padrão] ou ftps)
#              SITE_URL        (opcional: padrão https://steakburger.forgedevapps.com)
#              MESAS           (opcional: quantidade de cartões de mesa no PDF)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  SITE_URL: ${{ vars.SITE_URL || 'https://steakburger.forgedevapps.com' }}

jobs:
  build:
    name: Qualidade, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint e formatação
        run: npm run lint && npm run format:check

      - name: Checagem de tipos
        run: npm run check

      - name: Testes unitários
        run: npm test

      - name: Cache dos navegadores do Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegadores (Chromium, WebKit, Firefox)
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Build (site + PDFs + prévia do link)
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}
          MESAS: ${{ vars.MESAS }}

      - name: Testes E2E em vários aparelhos
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Guardar o site gerado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          include-hidden-files: true # inclui o .htaccess
          retention-days: 14

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: stackburguer:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test do container
        run: |
          docker run -d --name web -p 8080:8080 --read-only --tmpfs /tmp stackburguer:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'Steak Burger'
          curl -fsSI http://localhost:8080/cardapio-steak-burger.pdf | grep -qi 'content-type: application/pdf'
          curl -fsSI http://localhost:8080/og-image.jpg | grep -qi 'content-type: image/jpeg'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nao-existe)" = 404
          echo "✓ container ok"

  deploy:
    name: Deploy na Hostinger
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://steakburger.forgedevapps.com' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
    steps:
      - name: Baixar o site gerado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Conferir configuração do deploy
        run: |
          missing=()
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!name}" ] || missing+=("secret $name")
          done
          [ -n "$FTP_SERVER_DIR" ] || missing+=("variável FTP_SERVER_DIR")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltando em Settings → Secrets and variables → Actions: ${missing[*]}"
            exit 1
          fi
          case "$FTP_SERVER_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR precisa terminar com '/' (ex.: ./ ou public_html/steakburger/)"; exit 1 ;;
          esac

      # Evita publicar por engano em outra pasta (ex.: a do portfólio na mesma conta):
      # só segue se a pasta remota já for a do cardápio (versão nova ou antiga) ou estiver vazia.
      - name: Trava de segurança da pasta remota
        run: |
          base="ftp://${FTP_SERVER}/${FTP_SERVER_DIR}"
          if ! listing="$(curl -fsS --list-only --user "${FTP_USERNAME}:${FTP_PASSWORD}" "$base")"; then
            echo "::error::Não consegui listar $base — confira FTP_SERVER, usuário, senha e FTP_SERVER_DIR."
            exit 1
          fi
          files="$(printf '%s\n' "$listing" | tr -d '\r' | sed 's#.*/##' | grep -v '^\.\{1,2\}$' || true)"
          if [ -z "$files" ]; then
            echo "Pasta vazia: primeiro deploy."
          elif printf '%s\n' "$files" | grep -qx 'version.json'; then
            curl -fsS --user "${FTP_USERNAME}:${FTP_PASSWORD}" "${base}version.json" | grep -q '"app": "stackburguer"' \
              || { echo "::error::O version.json remoto não é deste projeto. Abortando."; exit 1; }
            echo "Pasta do cardápio confirmada (version.json)."
          elif printf '%s\n' "$files" | grep -qxE 'cardapio\.(json|css|js)'; then
            echo "Pasta do cardápio antigo confirmada (cardapio.*)."
          else
            echo "::error::A pasta $FTP_SERVER_DIR não parece ser a do cardápio. Arquivos encontrados:"
            printf '%s\n' "$files" | head -20
            exit 1
          fi

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          # Nome próprio para não colidir com o estado de outros sites na mesma conta.
          state-name: .ftp-deploy-stackburguer.json

      - name: Confirmar a nova versão no ar
        run: |
          for attempt in $(seq 1 20); do
            live="$(curl -fsS -H 'Cache-Control: no-cache' "${SITE_URL}/version.json?v=${GITHUB_SHA}-${attempt}" | jq -r .commit || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "✓ Versão ${GITHUB_SHA::7} publicada em ${SITE_URL}"
              exit 0
            fi
            sleep 6
          done
          echo "::error::A versão nova não apareceu em ${SITE_URL}/version.json (no ar: ${live:-nada})."
          exit 1
