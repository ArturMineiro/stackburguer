<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Cardápio - Steak Burger</title>
    <meta
      name="description"
      content="Cardápio oficial da Steak Burger — entradas, principais, bebidas e sobremesas."
    />
    <meta name="theme-color" content="#275643" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- OU (inline) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%23275643"/><stop offset="1" stop-color="%232b6d56"/></linearGradient></defs><rect rx="12" ry="12" width="64" height="64" fill="url(%23g)" stroke="%23ea7d17" stroke-width="2"/><path d="M12 30c0-8 7-14 20-14s20 6 20 14" fill="%23ea7d17"/><g fill="%23F5F1E3" opacity=".9"><circle cx="24" cy="23" r="1.2"/><circle cx="32" cy="21.5" r="1.2"/><circle cx="40" cy="23" r="1.2"/><circle cx="28" cy="25.5" r="1.2"/><circle cx="36" cy="25.5" r="1.2"/></g><rect x="14" y="31" width="36" height="4" rx="2" fill="%23398c6f"/><path d="M14 36h36v5l-6-2.2L38 41l-6-2-6 2-6-2-6 2v-3z" fill="%23ffd100"/><rect x="12" y="41" width="40" height="6" rx="3" fill="%238a4e1f"/><rect x="14" y="48" width="36" height="6" rx="3" fill="%23ea7d17"/></svg>'
    />

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <meta property="og:title" content="Steak Burger" />
    <meta property="og:description" content="Cardápio oficial da Steak Burger — entradas, principais, bebidas e sobremesas." />
    <meta property="og:image" content="https://steakburger.forgedevapps.com/imagens/home.jpg" />
    <meta property="og:url" content="https://steakburger.forgedevapps.com" />
    <meta property="og:type" content="website" />

    <!-- Estilos -->
    <link rel="stylesheet" href="cardapio.css" />
  </head>
  <body
    data-bs-spy="scroll"
    data-bs-target="#navbarNav"
    data-bs-offset="100"
    tabindex="0"
  >
    <!-- Header/Hero -->
    <header class="hero">
      <div class="container text-center">
        <div class="hero-image-wrap mx-auto">
          <img
            src="imagens/home.jpg"
            alt="Imagem principal da Steak Burger"
            class="hero-logo"
            loading="lazy"
          />
          <span class="hero-ring" aria-hidden="true"></span>
        </div>
        <h1 class="display-5 hero-title">Steak Burger</h1>
        <p class="lead hero-subtitle">
          Os melhores hambúrgueres em um só lugar!
        </p>
      </div>
      <svg
        class="hero-wave"
        viewBox="0 0 1440 120"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          d="M0,64 C240,112 480,0 720,48 C960,96 1200,64 1440,16 L1440,120 L0,120 Z"
        />
      </svg>
    </header>

    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Steak Burger</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-label="Abrir navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="#entradas">Entradas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#principais">Pratos Principais</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#bebidas">Bebidas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#sobremesas">Sobremesas</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Superfície com degradê sutil (meio do site) -->
    <main class="surface py-4">
      <div class="container">
        <!-- FILTROS -->
        <section class="filters py-4">
          <div class="container-fluid px-0">
            <div class="row g-3 align-items-center">
              <div class="col-12 col-lg-6">
                <label for="searchInput" class="form-label mb-1"
                  >Buscar item</label
                >
                <div class="input-group input-search shadow-sm">
                  <span class="input-group-text"
                    ><i class="fa-solid fa-magnifying-glass"></i
                  ></span>
                  <input
                    id="searchInput"
                    type="search"
                    class="form-control"
                    placeholder="Ex.: bacon, batata, milkshake…"
                    aria-label="Buscar no cardápio"
                  />
                  <button
                    id="clearSearch"
                    class="btn btn-outline-secondary"
                    type="button"
                    aria-label="Limpar busca"
                  >
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <div class="d-flex flex-wrap gap-2 align-items-center">
                  <span class="me-1 fw-semibold text-nowrap">Categorias:</span>

                  <input
                    class="btn-check"
                    type="radio"
                    name="cat"
                    id="cat-todas"
                    value="todas"
                    checked
                  />
                  <label
                    class="btn btn-chip icon-only"
                    for="cat-todas"
                    aria-label="Todas"
                    title="Todas"
                  >
                    <i class="fa-solid fa-layer-group"></i>
                  </label>

                  <input
                    class="btn-check"
                    type="radio"
                    name="cat"
                    id="cat-entradas"
                    value="entradas"
                  />
                  <label
                    class="btn btn-chip icon-only"
                    for="cat-entradas"
                    aria-label="Entradas"
                    title="Entradas"
                  >
                    <i class="fa-solid fa-utensils"></i>
                  </label>

                  <input
                    class="btn-check"
                    type="radio"
                    name="cat"
                    id="cat-principais"
                    value="principais"
                  />
                  <label
                    class="btn btn-chip icon-only"
                    for="cat-principais"
                    aria-label="Pratos Principais"
                    title="Pratos Principais"
                  >
                    <i class="fa-solid fa-burger"></i>
                  </label>

                  <input
                    class="btn-check"
                    type="radio"
                    name="cat"
                    id="cat-bebidas"
                    value="bebidas"
                  />
                  <label
                    class="btn btn-chip icon-only"
                    for="cat-bebidas"
                    aria-label="Bebidas"
                    title="Bebidas"
                  >
                    <i class="fa-solid fa-martini-glass-citrus"></i>
                  </label>

                  <input
                    class="btn-check"
                    type="radio"
                    name="cat"
                    id="cat-sobremesas"
                    value="sobremesas"
                  />
                  <label
                    class="btn btn-chip icon-only"
                    for="cat-sobremesas"
                    aria-label="Sobremesas"
                    title="Sobremesas"
                  >
                    <i class="fa-solid fa-ice-cream"></i>
                  </label>
                </div>
              </div>
            </div>
            <div
              id="noResults"
              class="alert alert-warning d-none mt-3 mb-0"
              role="status"
            >
              Nenhum item encontrado. Tente termos diferentes ou limpe a busca.
            </div>
          </div>
        </section>

        <!-- ENTRADAS -->
      <section id="entradas" class="mb-5">
  <h2 class="section-title text-center">
    Entradas
    <span class="title-underline"></span>
  </h2>
  <div id="lista-entradas" class="row g-4"></div>
</section>

<section id="principais" class="mb-5">
  <h2 class="section-title text-center">
    Pratos Principais
    <span class="title-underline"></span>
  </h2>
  <div id="lista-principais" class="row g-4"></div>
</section>

<section id="bebidas" class="mb-5">
  <h2 class="section-title text-center">
    Bebidas
    <span class="title-underline"></span>
  </h2>
  <div id="lista-bebidas" class="row g-4"></div>
</section>

<section id="sobremesas" class="mb-5">
  <h2 class="section-title text-center">
    Sobremesas
    <span class="title-underline"></span>
  </h2>
  <div id="lista-sobremesas" class="row g-4"></div>
</section>

<!-- Área onde os modais serão criados -->
<div id="modals-area"></div>

      </div>
      </main> 
    <!-- Footer -->
    <div id="footer-container"></div>


    <!-- Voltar ao topo -->
    <button
      id="backToTop"
      class="btn btn-primary back-to-top"
      aria-label="Voltar ao topo"
    >
      <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="cardapio.js"></script>
  </body>
</html>
